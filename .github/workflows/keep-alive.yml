name: Keep Streamlit App Alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app
        run: |
          curl -sSL --max-time 30 -o /dev/null -w "%{http_code}" https://projeto-leitor-excel.streamlit.app || true
          curl -sSL --max-time 30 -o /dev/null -w "%{http_code}" https://projeto-leitor-excel.streamlit.app/_stcore/health || true
